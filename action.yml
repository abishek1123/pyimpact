name: "PyImpact"
description: "Comment the blast radius of a pull request's Python changes, found by static call/import-graph analysis."
author: "abishek1123"
branding:
  icon: "crosshair"
  color: "purple"

inputs:
  path:
    description: "Directory to analyze, relative to the repository root."
    default: "."
  base:
    description: "Ref to compare against (its merge-base with HEAD). Defaults to the pull request's base branch."
    default: ""
  comment:
    description: "Post, or update in place, a pull-request comment with the report."
    default: "true"
  fail-on:
    description: "Fail the job if the change reaches this level: never, breaking, high, medium or low."
    default: "never"
  max-items:
    description: "Maximum rows in the report table."
    default: "40"
  exclude:
    description: "Glob patterns to skip, separated by spaces or newlines (e.g. 'docs */migrations/*')."
    default: ""
  python-version:
    description: "Python version used to run PyImpact."
    default: "3.12"
  github-token:
    description: "Token used to post the comment."
    default: ${{ github.token }}

outputs:
  affected:
    description: "Number of affected components."
    value: ${{ steps.report.outputs.affected }}
  high:
    description: "Number of high-severity affected components."
    value: ${{ steps.report.outputs.high }}
  medium:
    description: "Number of medium-severity affected components."
    value: ${{ steps.report.outputs.medium }}
  low:
    description: "Number of low-severity affected components."
    value: ${{ steps.report.outputs.low }}
  breaking:
    description: "Number of components still referencing code the change removes."
    value: ${{ steps.report.outputs.breaking }}
  tests:
    description: "Number of affected test functions."
    value: ${{ steps.report.outputs.tests }}
  report:
    description: "Path to the Markdown report."
    value: ${{ steps.report.outputs.report }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install PyImpact
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    - name: Analyze the change
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        # merge-base needs history: deepen a shallow checkout if necessary.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --quiet --unshallow origin || git fetch --no-tags --quiet --deepen=1000 origin || true
        fi
        base="$INPUT_BASE"
        if [ -z "$base" ] && [ -n "$BASE_REF" ]; then
          git fetch --no-tags --quiet origin "$BASE_REF" || true
          base="origin/$BASE_REF"
        fi
        if [ -z "$base" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          base="$BEFORE_SHA"
        fi
        if [ -z "$base" ]; then
          base="HEAD~1"
        fi
        set -f   # exclude patterns must reach pyimpact unexpanded
        args=()
        for pattern in $INPUT_EXCLUDE; do args+=(--exclude "$pattern"); done
        set +f
        echo "Comparing against $base"
        pyimpact diff "$INPUT_PATH" --base "$base" --format json \
          --output "$RUNNER_TEMP/pyimpact.json" ${args[@]+"${args[@]}"}

    - name: Build the report
      id: report
      shell: bash
      env:
        MAX_ITEMS: ${{ inputs.max-items }}
      run: |
        python -m pyimpact.ci --json "$RUNNER_TEMP/pyimpact.json" \
          --markdown "$RUNNER_TEMP/pyimpact.md" --max-items "$MAX_ITEMS"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request
      continue-on-error: true   # e.g. pull requests from forks get a read-only token
      uses: actions/github-script@v8
      env:
        REPORT: ${{ runner.temp }}/pyimpact.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(process.env.REPORT, "utf8");
          const marker = "<!-- pyimpact-report -->";
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Apply fail-on
      if: inputs.fail-on != 'never'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: python -m pyimpact.ci --json "$RUNNER_TEMP/pyimpact.json" --gate-only --fail-on "$FAIL_ON"
